spring:
  application:
    name: erp-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erp}
    username: ${DB_USERNAME:erp}
    password: ${DB_PASSWORD:erp}
    hikari:
      maximum-pool-size: 10
      pool-name: erp-pool

  jpa:
    open-in-view: false          # avoid lazy-loading in the view layer
    hibernate:
      ddl-auto: validate         # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
    show-sql: false

  # Boot's single Flyway is disabled; FlywayConfig runs one pipeline per module schema.
  flyway:
    enabled: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

# ── Application-specific security settings ──────────────────────────
erp:
  security:
    jwt:
      # Override in real environments via ERP_SECURITY_JWT_SECRET (min 32 chars).
      secret: ${ERP_SECURITY_JWT_SECRET:change-me-in-production-this-is-a-dev-secret-key-0123456789}
      issuer: erp-platform
      expiration-minutes: 120

  # ── Stock Management Agent ─────────────────────────────────────────
  store:
    agent:
      # Master switch for the reorder-evaluation listener.
      enabled: ${ERP_STORE_AGENT_ENABLED:true}
      # Active agent implementation: `rule-based` (no LLM, default) or `llm`.
      mode: ${ERP_STORE_AGENT_MODE:rule-based}

  # ── Oil Mart ───────────────────────────────────────────────────────
  oilmart:
    # Snapshotted onto each quotation and invoice, so a later rate change
    # never rewrites the totals of documents already issued.
    gst-rate-percent: ${ERP_OILMART_GST_RATE_PERCENT:10.00}
    currency-code: ${ERP_OILMART_CURRENCY_CODE:PGK}
    # Letterhead on the quotation and invoice PDFs sent to clients.
    company:
      name: ${ERP_OILMART_COMPANY_NAME:Enlear Oil Mart (Pvt) Ltd}
      # Pipes (or newlines) separate the printed address lines on the letterhead.
      address: ${ERP_OILMART_COMPANY_ADDRESS:No. 42, Nawala Road|Colombo 05|Sri Lanka}
      phone: ${ERP_OILMART_COMPANY_PHONE:+94 11 234 5678}
      fax: ${ERP_OILMART_COMPANY_FAX:+94 11 234 5679}
      email: ${ERP_OILMART_COMPANY_EMAIL:sales@enlear.com}
      registration-number: ${ERP_OILMART_COMPANY_REGISTRATION_NUMBER:PV 123456}
      tax-number: ${ERP_OILMART_COMPANY_TAX_NUMBER:100123456}
      # Optional letterhead logo; absolute file path or blank for none.
      logo-path: ${ERP_OILMART_COMPANY_LOGO_PATH:}
    # Printed on invoices; snapshotted at invoice creation.
    bank:
      account-name: ${ERP_OILMART_BANK_ACCOUNT_NAME:Enlear Oil Mart (Pvt) Ltd}
      bank-name: ${ERP_OILMART_BANK_NAME:Commercial Bank of Ceylon PLC}
      branch: ${ERP_OILMART_BANK_BRANCH:Colombo 03}
      account-number: ${ERP_OILMART_BANK_ACCOUNT_NUMBER:1000123456}
      swift-code: ${ERP_OILMART_BANK_SWIFT_CODE:CCEYLKLX}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.enlear.erp: INFO
    org.flywaydb: INFO
